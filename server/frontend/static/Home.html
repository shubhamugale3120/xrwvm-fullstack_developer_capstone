
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dealerships | Home</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
    crossorigin="anonymous"
  >

  <!-- Project CSS -->
  <link rel="stylesheet" href="/static/style.css">

  <script>
    async function logout(event) {
      if (event) event.preventDefault();

      try {
        // Call the project's logout endpoint.
        const response = await fetch("/djangoapp/logout", {
          method: "GET",
          credentials: "same-origin"
        });

        if (response.ok) {
          sessionStorage.removeItem("username");
          window.location.href = "/";
        } else {
          alert("Logout failed. Please try again.");
        }
      } catch (error) {
        console.error("Logout error:", error);
        alert("Unable to log out. Please try again.");
      }
    }

    function checkSession() {
      const loginLogout = document.getElementById("loginlogout");
      const currentUser = sessionStorage.getItem("username");

      if (currentUser && currentUser.trim() !== "") {
        loginLogout.innerHTML = `
          <span class="homepage_links"></span>
          <a class="homepage_links" href="/">Logout</a>
        `;

        loginLogout.querySelector("span").textContent = currentUser;
        loginLogout.querySelector("a").addEventListener("click", logout);
      } else {
        loginLogout.innerHTML = `
          <a class="homepage_links" href="/login">Login</a>
          <a class="homepage_links" href="/register">Register</a>
        `;
      }
    }
  </script>
</head>

<body onload="checkSession()">
  <nav class="navbar navbar-expand-lg navbar-light"
       style="background-color: darkturquoise; min-height: 1in;">
    <div class="container-fluid">
      <a class="navbar-brand" href="/" style="padding-right: 5%;">
        <h2 class="mb-0">Dealerships</h2>
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarText"
        aria-controls="navbarText"
        aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarText">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active"
               style="font-size: larger;"
               aria-current="page"
               href="/">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link"
               style="font-size: larger;"
               href="/about">About Us</a>
          </li>

          <li class="nav-item">
            <a class="nav-link"
               style="font-size: larger;"
               href="/contact">Contact Us</a>
          </li>
        </ul>

        <div class="navbar-text loginlink" id="loginlogout"></div>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="card mx-auto shadow-sm" style="width: 100%; max-width: 700px;">
      <img
        src="/static/car_dealership.jpg"
        class="card-img-top"
        alt="Cars displayed at a dealership"
        style="max-height: 400px; object-fit: cover;"
      >

      <div class="card-body text-center">
        <h1 class="h4 card-title">Welcome to our Dealerships!</h1>
        <p class="card-text">
          Explore dealerships and discover available vehicles.
        </p>

        <a href="/dealers" class="btn btn-info m-2">
          View Dealerships
        </a>
      </div>
    </div>
  </main>

  <!-- Bootstrap JavaScript bundle -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous">
  </script>
</body>
</html>
